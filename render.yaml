services:
  - type: web
    name: acumen-backend
    runtime: python
    # This command installs dependencies inside the backend folder
    buildCommand: pip install -r requirements.txt
    # This command starts the FastAPI server
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Root directory for the backend service within the monorepo
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ACUMEN_DATA_DIR
        value: /var/data
      # You will need to manually add the following secrets in the Render Dashboard:
      # - GOOGLE_API_KEY
      # - OPENAI_API_KEY
      # - HUGGINGFACE_API_KEY
      # - CLERK_SECRET_KEY
      # - CLERK_PUBLISHABLE_KEY
    disk:
      name: acumen-storage
      mountPath: /var/data
      sizeGB: 1
