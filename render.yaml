services:
  - type: web
    name: acumen-backend
    runtime: python
    # Build: install deps from the backend folder
    buildCommand: pip install -r requirements.txt
    # Start: run FastAPI on the PORT provided by Render
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    # Root directory for backend in the monorepo
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ACUMEN_DATA_DIR
        value: /var/data
      # Add the following secrets manually in the Render Dashboard:
      # - GOOGLE_API_KEY
      # - HUGGINGFACE_API_KEY
      # - CLERK_SECRET_KEY
      # - CLERK_PUBLISHABLE_KEY
      # - CLERK_JWKS_URL   (e.g. https://<your-clerk-domain>/.well-known/jwks.json)
    disk:
      name: acumen-storage
      mountPath: /var/data
      sizeGB: 1
